# Tiny Tapeout project information
project:
  title:        "Fixed-latency tick-to-trade decision core"      
  author:       "Bhavya Sharma"    
  discord:      ""      
  description:  "Constant-latency price threshold comparator for market data streams"      
  language:     "SystemVerilog" 
  clock_hz:     50000000       

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x2"          

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_bhavya_srm_ttt_core"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_bhavya_srm_ttt_core.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "DATA0"
  ui[1]: "DATA1"
  ui[2]: "DATA2"
  ui[3]: "DATA3"
  ui[4]: "DATA4"
  ui[5]: "DATA5"
  ui[6]: "DATA6"
  ui[7]: "DATA7"

  # Outputs
  uo[0]: "FIRE0"
  uo[1]: "FIRE1"
  uo[2]: "FIRE2"
  uo[3]: "FIRE3"
  uo[4]: "FIRE_VALID"
  uo[5]: "LAT_MARKER"
  uo[6]: "MALFORMED"
  uo[7]: "HEARTBEAT"

  # Bidirectional pins
  uio[0]: "SOP"
  uio[1]: "BYTE_VALID"
  uio[2]: "CFG_EN"
  uio[3]: "CFG_SDI"
  uio[4]: "DBG_ST0"
  uio[5]: "DBG_ST1"
  uio[6]: "DBG_ST2"
  uio[7]: "DBG_ST3"

# Do not change!
yaml_version: 6
